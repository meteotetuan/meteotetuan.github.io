<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Se elimina la etiqueta viewport responsiva para forzar la vista de PC en móviles -->
    <title>Estación Meteorológica - MeteoTetuán (Vista PC)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width:1000px;
            height: 100%;
            background-color: #f4f4f9;
        }

        /* Forzamos al contenedor a tener la anchura típica de una pantalla de PC */
        .iframe-container {
            width: 100%;
            min-width: 1000px; /* Ajusta este valor si la web original es más ancha o estrecha */
            height: 100vh;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://meteotetuan.w5.lt/Weather_Summary_Vantage_Pro_Plus.html" 
            title="MeteoTetuán - Weather Summary">
        </iframe>
    </div>

</body>
</html>
