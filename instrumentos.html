<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MeteoTetuán - Instrumentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }
        .container {
            width: 820px; 
            margin: 0 auto;
            background-color: #ffffff;
            padding: 15px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            border-radius: 5px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 15px;
        }
        .weather-img {
            width: 800px;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }
        .btn-inicio {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-inicio:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MeteoTetuán - Instrumentos</h1>
        <img src="https://meteotetuan.w5.lt/pantalla.jpg" alt="MeteoTetuán - Instrumentos" class="weather-img">
        <a href="https://meteotetuan.github.io" class="btn-inicio">Volver a la página de inicio</a>
    </div>
 
</body>
</html>
