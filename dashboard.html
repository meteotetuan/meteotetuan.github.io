<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Fijo MeteoTetuán</title>
  <style>
    /* DISEÑO VISUAL DE TARJETAS GRANDES Y FIJAS */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f9;
      margin: 0;
      padding: 15px;
      color: #2c3e50;
    }
    
    /* Contenedor principal con la estructura fija solicitada */
    .dashboard-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* FILA SUPERIOR: 5 Tarjetas Grandes Fijas */
    .fila-arriba {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    /* FILA INFERIOR: 4 Tarjetas Grandes Fijas */
    .fila-abajo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    /* Estilo de Tarjeta Grande */
    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      border: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100px;
    }
    
    .tarjeta h3 {
      margin: 0 0 12px 0;
      font-size: 0.85rem;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    
    .valor {
      font-size: 2.2rem; /* Tamaño de letra más grande */
      font-weight: 700;
      color: #1e272e;
      margin: 0;
    }
    
    .unidad {
      font-size: 1.1rem;
      font-weight: 500;
      color: #7f8c8d;
      margin-left: 3px;
    }

    /* Líneas de color temáticas */
    .temp { border-top: 6px solid #ff6b6b; }
    .dew { border-top: 6px solid #38ada9; }
    .hum { border-top: 6px solid #4dadf7; }
    .viento { border-top: 6px solid #51cf66; }
    .presion { border-top: 6px solid #cc5de8; }
    .lluvia { border-top: 6px solid #ff9f43; }
    .tasa-lluvia { border-top: 6px solid #ee5253; }
    .uv { border-top: 6px solid #feca57; }
    .solar { border-top: 6px solid #ffbe76; }

    .actualizado {
      text-align: center;
      font-size: 0.85rem;
      color: #2c3e50;
      font-weight: bold;
      background: #e3fafc;
      padding: 8px 20px;
      border-radius: 8px;
      display: inline-block;
      margin: 20px auto 0 auto;
    }
    .center-wrapper {
      text-align: center;
    }

    /* Adaptación para pantallas de móviles (se vuelven columnas automáticamente para que no se aplaste) */
    @media (max-width: 768px) {
      .fila-arriba, .fila-abajo {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-grid">
    
    <!-- FILA SUPERIOR (5 TARJETAS) -->
    <div class="fila-arriba">
      <div class="tarjeta temp">
        <h3>Temperatura</h3>
        <p class="valor" id="txt-temp">--<span class="unidad">°C</span></p>
      </div>

      <div class="tarjeta dew">
        <h3>Punto Rocío</h3>
        <p class="valor" id="txt-dew">--<span class="unidad">°C</span></p>
      </div>
      
      <div class="tarjeta hum">
        <h3>Humedad</h3>
        <p class="valor" id="txt-hum">--<span class="unidad">%</span></p>
      </div>
      
      <div class="tarjeta viento">
        <h3>Viento</h3>
        <p class="valor" id="txt-viento">--<span class="unidad">km/h</span></p>
      </div>

      <div class="tarjeta viento">
        <h3>Dirección</h3>
        <p class="valor" id="txt-dir">--</p>
      </div>
    </div>

    <!-- FILA INFERIOR (4 TARJETAS) -->
    <div class="fila-abajo">
      <div class="tarjeta presion">
        <h3>Presión</h3>
        <p class="valor" id="txt-presion">--<span class="unidad">hPa</span></p>
      </div>

      <div class="tarjeta lluvia">
        <h3>Lluvia Hoy</h3>
        <p class="valor" id="txt-lluvia">--<span class="unidad">mm</span></p>
      </div>

      <div class="tarjeta uv">
        <h3>Índice UV</h3>
        <p class="valor" id="txt-uv">--<span class="unidad">UVI</span></p>
      </div>

      <div class="tarjeta solar">
        <h3>Rad. Solar</h3>
        <p class="valor" id="txt-solar">--<span class="unidad">W/m²</span></p>
      </div>
    </div>

  </div>

  <div class="center-wrapper">
    <div class="actualizado" id="txt-tiempo">Sincronizando MeteoTetuán...</div>
  </div>

<!-- MOTOR DE PROCESAMIENTO JAVASCRIPT SIMPLIFICADO -->
  <script>
    function fahrenheitACelsius(f) { return f !== null ? ((f - 32) * 5 / 9).toFixed(1) : '--'; }
    function millasAKilometros(mph) { return mph !== null ? (mph * 1.60934).toFixed(1) : '--'; }
    function pulgadasAMilibares(inhg) { return inhg !== null ? (inhg * 33.8639).toFixed(1) : '--'; }
    
    function gradosADireccion(grados) {
      if (grados === null || grados === undefined) return '--';
      const direcciones = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const val = Math.floor((grados / 22.5) + 0.5);
      return direcciones[(val % 16)];
    }

    function actualizarDashboard() {
      fetch('clima.json?v=' + Date.now())
        .then(response => {
          if (!response.ok) throw new Error('Archivo no disponible.');
          return response.json();
        })
        .then(datos => {
          
          // Asignar hora oficial real del JSON
          if (datos.generated_at) {
            const fechaReal = new Date(datos.generated_at * 1000); 
            const opcionesHora = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('txt-tiempo').innerText = 'Última lectura real de la estación: ' + fechaReal.toLocaleTimeString('es-ES', opcionesHora);
          }

          if (datos.sensors && datos.sensors.length > 0) {
            let m = {};
            
            datos.sensors.forEach(sensor => {
              if (sensor.data && Array.isArray(sensor.data) && sensor.data.length > 0) {
                Object.assign(m, sensor.data[0]);
              } else if (sensor.data && typeof sensor.data === 'object') {
                Object.assign(m, sensor.data);
              }
            });

            // 1. Temperatura Exterior
            if (m.temp !== undefined && m.temp !== null) {
              document.getElementById('txt-temp').innerHTML = fahrenheitACelsius(m.temp) + '<span class="unidad">°C</span>';
            }
            
            // 2. Punto de Rocío
            if (m.dew_point !== undefined && m.dew_point !== null) {
              document.getElementById('txt-dew').innerHTML = fahrenheitACelsius(m.dew_point) + '<span class="unidad">°C</span>';
            }
            
            // 3. Humedad Exterior
            if (m.hum !== undefined && m.hum !== null) {
              document.getElementById('txt-hum').innerHTML = Math.round(m.hum) + '<span class="unidad">%</span>';
            }
            
            // 4. Viento Actual Instantáneo
            if (m.wind_speed_last !== undefined && m.wind_speed_last !== null) {
              document.getElementById('txt-viento').innerHTML = millasAKilometros(m.wind_speed_last) + '<span class="unidad">km/h</span>';
            }
            
            // 5. Dirección del Viento
            if (m.wind_dir_last !== undefined && m.wind_dir_last !== null) {
              document.getElementById('txt-dir').innerText = m.wind_dir_last + '° (' + gradosADireccion(m.wind_dir_last) + ')';
            }
            
            // 6. Presión Atmosférica
            if (m.bar_sea_level !== undefined && m.bar_sea_level !== null) {
              document.getElementById('txt-presion').innerHTML = pulgadasAMilibares(m.bar_sea_level) + '<span class="unidad">hPa</span>';
            }
            
            // 7. Lluvia del Día
            if (m.rainfall_daily_mm !== undefined && m.rainfall_daily_mm !== null) {
              document.getElementById('txt-lluvia').innerHTML = m.rainfall_daily_mm.toFixed(1) + '<span class="unidad">mm</span>';
            } else if (m.rainfall_daily_in !== undefined && m.rainfall_daily_in !== null) {
              document.getElementById('txt-lluvia').innerHTML = (m.rainfall_daily_in * 25.4).toFixed(1) + '<span class="unidad">mm</span>';
            }
            
            // 8. Índice UV
            if (m.uv_index !== undefined && m.uv_index !== null) {
              document.getElementById('txt-uv').innerHTML = m.uv_index.toFixed(1) + '<span class="unidad">UVI</span>';
            }
            
            // 9. Radiación Solar
            if (m.solar_rad !== undefined && m.solar_rad !== null) {
              document.getElementById('txt-solar').innerHTML = Math.round(m.solar_rad) + '<span class="unidad">W/m²</span>';
            }
          }
        })
        .catch(error => {
          console.error('Error procesando el JSON:', error);
          document.getElementById('txt-tiempo').innerText = 'Error al actualizar el panel de control.';
        });
    }

    document.addEventListener('DOMContentLoaded', actualizarDashboard);
    setInterval(actualizarDashboard, 60000);
  </script>
</body>
</html>
