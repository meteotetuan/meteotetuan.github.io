<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecowitt Lightning Dashboard</title>
    <!-- Cargamos Chart.js para los gráficos y fuentes modernas -->
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-amber: #fbbf24;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #fbbf24, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            border: 1px solid #334155;
        }

        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .card-unit {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .chart-container {
            width: 100%;
            max-width: 1000px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
            box-sizing: border-box;
        }

        .status-container {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Monitor de Tormentas Ecowitt</h1>
        <p>Datos en tiempo real extraídos del detector de rayos</p>
    </header>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Impactos Hoy</div>
            <div class="card-value" id="lightning-count" style="color: var(--accent-amber);">0</div>
            <div class="card-unit">descargas registradas</div>
        </div>

        <div class="card">
            <div class="card-title">Distancia Estimada</div>
            <div class="card-value" id="lightning-distance" style="color: var(--accent-blue);">--</div>
            <div class="card-unit" id="distance-unit">km (Cercanía)</div>
        </div>

        <div class="card">
            <div class="card-title">Último Rayo</div>
            <div class="card-value" id="lightning-time" style="font-size: 1.6rem; padding: 15px 0;">Ninguno</div>
            <div class="card-unit" id="lightning-date">Sin actividad reciente</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="lightningChart" height="120"></canvas>
    </div>

    <div class="status-container">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Actualizando datos automáticamente cada 2 minutos...</span>
    </div>
    
    <script>
        // Tus credenciales y claves de Ecowitt ya enlazadas
        const apiKey = "ed9bfa7c-9a2f-46ce-8c4a-ba2e8658e771";
        const appKey = "5A653E777817282B24220D843DDF8911";
        const mac = "80F1B2EA7F58"; 
        const url = `https://ecowitt.net{apiKey}&application_key=${appKey}&mac=${mac}&call_fields=lightning`;

        // Configuración inicial del gráfico con Chart.js
        const ctx = document.getElementById('lightningChart').getContext('2d');
        const lightningChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Distancia del Rayo (km - Valores más bajos significan más cerca)',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 40, // Rango máximo del sensor WH57
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    x: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } }
                }
            }
        });

        // Consulta de datos al servidor en la nube de Ecowitt
        async function fetchLightningData() {
            try {
                const response = await fetch(url);
                const result = await response.json();

                if (result.code === 0 && result.data && result.data.lightning) {
                    const lightningData = result.data.lightning;
                    
                    const count = lightningData.count.value || 0;
                    const distance = lightningData.distance.value || null;
                    const timestamp = lightningData.timestamp ? parseInt(lightningData.timestamp.value) : null;

                    // Mostrar conteo de impactos
                    document.getElementById('lightning-count').innerText = count;

                    // Mostrar distancia y cambiar color si baja de 12 km
                    const distanceElement = document.getElementById('lightning-distance');
                    if (distance !== null && distance !== "") {
                        distanceElement.innerText = distance;
                        document.getElementById('distance-unit').innerText = `km de distancia`;
                        
                        if (parseInt(distance) <= 12) {
                            distanceElement.style.color = '#ef4444'; 
                        } else {
                            distanceElement.style.color = '#38bdf8';
                        }
                    } else {
                        distanceElement.innerText = "--";
                        document.getElementById('distance-unit').innerText = "Sin registros";
                    }

                    // Formatear hora del último impacto
                    if (timestamp) {
                        const dateObj = new Date(timestamp * 1000);
                        const timeString = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        const dateString = dateObj.toLocaleDateString([], { day: 'numeric', month: 'short' });
                        
                        document.getElementById('lightning-time').innerText = timeString;
                        document.getElementById('lightning-date').innerText = dateString;
                    }

                    // Actualizar puntos de la gráfica de líneas
                    const now = new Date();
                    const currentTimeLabel = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    if (distance !== null && distance !== "") {
                        lightningChart.data.labels.push(currentTimeLabel);
                        lightningChart.data.datasets[0].data.push(parseInt(distance));

                        if (lightningChart.data.labels.length > 10) {
                            lightningChart.data.labels.shift();
                            lightningChart.data.datasets[0].data.shift();
                        }
                        lightningChart.update();
                    }

                    document.getElementById('status-dot').style.backgroundColor = '#22c55e';
                    document.getElementById('status-text').innerText = `Última consulta exitosa: ${now.toLocaleTimeString()}`;

                } else {
                    document.getElementById('status-text').innerText = "Conectado. Esperando que el sensor reporte datos de rayos.";
                }
            } catch (error) {
                console.error("Error en API Ecowitt:", error);
                document.getElementById('status-dot').style.backgroundColor = '#ef4444';
                document.getElementById('status-text').innerText = "Error al conectar con Ecowitt. Revisa tu red.";
            }
        }

        // Ejecución inmediata y temporizador automático cada 2 minutos
        fetchLightningData();
        setInterval(fetchLightningData, 120000);
    </script>
</body>
</html>
