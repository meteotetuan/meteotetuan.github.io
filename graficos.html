<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoTetuán - gráficos diarios</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 35px;
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            color: #1a1a1a;
            font-weight: 700;
        }

        /* Grid optimizado para gráficos apaisados (2 columnas en escritorio) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 50px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #444;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        /* Contenedor estirado y cursor de lupa para indicar zoom */
        .img-container {
            width: 100%;
            border-radius: calc(var(--radius) - 4px);
            background-color: #fafafa;
            cursor: zoom-in;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .img-container:hover {
            transform: scale(1.01);
        }

        /* Forzamos a que el gráfico ocupe todo el ancho estirándose de forma limpia */
        .card img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast; /* Mejora la nitidez de gráficos antiguos pixelados */
            image-rendering: crisp-edges;
        }

        /* Estilos del Visor Modal (Pantalla Completa al hacer clic) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            max-width: 95%;
            max-height: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 6px;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        /* Botón de cierre del modal */
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            margin-top: auto;
            padding: 20px 0;
        }

        .btn-back {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-back:hover {
            background-color: var(--primary-hover);
        }

        .btn-back:active {
            transform: scale(0.98);
        }

        /* Adaptación para pantallas medianas y móviles */
        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: 1fr; /* Una sola columna en tablets y móviles */
                gap: 20px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>MeteoTetuán - Gráficos diarios</h2>
    </header>

    <main class="grid-container">
        <!-- Gráfico 1 -->
        <section class="card">
            <h2>Temperatura y Humedad</h2>
            <div class="img-container" onclick="openModal(this)">
                <img src="https://meteotetuan.w5.lt/temphum.jpg" alt="Gráfico de Temperatura y Humedad">
            </div>
        </section>

        <!-- Gráfico 2 -->
        <section class="card">
            <h2>Presión atmosférica</h2>
            <div class="img-container" onclick="openModal(this)">
                <img src="https://meteotetuan.w5.lt/baro.jpg" alt="Gráfico de Presión">
            </div>
        </section>

        <!-- Gráfico 3 -->
        <section class="card">
            <h2>Dirección del viento</h2>
            <div class="img-container" onclick="openModal(this)">
                <img src="https://meteotetuan.w5.lt/direction.jpg" alt="Gráfico de Viento">
            </div>
        </section>

        <!-- Gráfico 4 -->
        <section class="card">
            <h2>Velocidad del viento</h2>
            <div class="img-container" onclick="openModal(this)">
                <img src="https://meteotetuan.w5.lt/speed.jpg" alt="Gráfico de Velocidad">
            </div>
        </section>

        <!-- Gráfico 5 -->
        <section class="card">
            <h2>Radiación Solar</h2>
            <div class="img-container" onclick="openModal(this)">
                <img src="https://meteotetuan.w5.lt/solar.jpg" alt="Gráfico de Radiación Solar">
            </div>
        </section>

        <!-- Gráfico 6 -->
        <section class="card">
            <h2>Precipitación</h2>
            <div class="img-container" onclick="openModal(this)">
                <img src="https://meteotetuan.w5.lt/rain.jpg" alt="Gráfico de Precipitación">
            </div>
        </section>
    </main>

    <footer>
        <a href="https://meteotetuan.github.io" class="btn-back">Volver a la página de inicio</a>
    </footer>

    <!-- Ventana Modal para Zoom -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg" alt="Gráfico Ampliado">
    </div>

    <script>
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");

        function openModal(element) {
            const imgSrc = element.querySelector("img").src;
            modalImg.src = imgSrc;
            modal.classList.add("show");
        }

        function closeModal() {
            modal.classList.remove("show");
        }

        // Permitir cerrar también presionando la tecla Escape
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>

</body>
</html>
