<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Extremos - MeteoTetuán</title>
  <style>
    /* DISEÑO COMPACTO PREMIUM MATTE PARA EXTREMOS */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f6f8;
      margin: 0;
      padding: 5px 10px 10px 10px;
      color: #fff;
    }
    
    .dashboard-grid {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px; /* Espaciado más reducido */
    }

    /* Pestañas compactas */
    .selector-periodo {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-pestana {
      background-color: #edf2f7;
      color: #4a5568;
      border: 1px solid #e2e8f0;
      padding: 6px 20px; /* Más estrechos */
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-pestana.activo {
      background-color: #4a69bd;
      color: #fff;
      border-color: #4a69bd;
      box-shadow: 0 2px 6px rgba(74,105,189,0.2);
    }
    .btn-pestana:hover:not(.activo) {
      background-color: #e2e8f0;
    }

    /* Rejilla optimizada en 3 columnas fijas */
    .fila-1, .fila-2, .fila-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    /* Tarjetas de altura reducida */
    .tarjeta {
      border-radius: 12px;
      padding: 12px 10px; /* Reducido a casi la mitad */
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .icono {
      font-size: 1.2rem; /* Más discreto */
      margin-bottom: 2px;
      opacity: 0.9;
    }
    
    .tarjeta h3 {
      margin: 0 0 4px 0;
      font-size: 0.7rem; /* Texto más sutil */
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    
    .valor {
      font-size: 1.4rem; /* Considerablemente más bajo para ahorrar espacio vertical */
      font-weight: 700;
      margin: 0;
    }
    
    .unidad {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      margin-left: 1px;
    }

    /* COLORES MATE ORIGINALES */
    .temp-max { background-color: #4a69bd; }
    .temp-min { background-color: #60a3bc; }
    .viento { background-color: #3c6382; }
    .hum-max { background-color: #6a89cc; }
    .hum-min { background-color: #4b6584; }
    .uv { background-color: #d4af37; }
    .presion-max { background-color: #38ada9; }
    .presion-min { background-color: #57606f; }
    .lluvia { background-color: #20b2aa; }

    /* Barra inferior */
    .actualizado {
      text-align: center;
      font-size: 0.75rem;
      color: #4a5568;
      font-weight: 600;
      background: #edf2f7;
      padding: 5px 18px;
      border-radius: 15px;
      display: inline-block;
      margin: 12px auto 0 auto;
      border: 1px solid #e2e8f0;
    }
    .center-wrapper { text-align: center; }

    @media (max-width: 768px) {
      .fila-1, .fila-2, .fila-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="selector-periodo">
    <button onclick="switchPeriod('dia')" id="btn-dia" class="btn-pestana activo">📅 Diarios</button>
    <button onclick="switchPeriod('mes')" id="btn-mes" class="btn-pestana">🗓️ Mensuales</button>
    <button onclick="switchPeriod('any')" id="btn-any" class="btn-pestana">🎆 Anuales</button>
  </div>

  <div class="dashboard-grid">
    <div class="fila-1">
      <div class="tarjeta temp-max">
        <div class="icono">🔥</div>
        <h3>Temperatura Máxima</h3>
        <p class="valor" id="ext-tmax">--<span class="unidad">°C</span></p>
      </div>
      <div class="tarjeta temp-min">
        <div class="icono">❄️</div>
        <h3>Temperatura Mínima</h3>
        <p class="valor" id="ext-tmin">--<span class="unidad">°C</span></p>
      </div>
      <div class="tarjeta viento">
        <div class="icono">🌪️</div>
        <h3>Racha Máxima Viento</h3>
        <p class="valor" id="ext-vmax">--<span class="unidad">km/h</span></p>
      </div>
    </div>

    <div class="fila-2">
      <div class="tarjeta hum-max">
        <div class="icono">💧</div>
        <h3>Humedad Máxima</h3>
        <p class="valor" id="ext-hmax">--<span class="unidad">%</span></p>
      </div>
      <div class="tarjeta hum-min">
        <div class="icono">🏜️</div>
        <h3>Humedad Mínima</h3>
        <p class="valor" id="ext-hmin">--<span class="unidad">%</span></p>
      </div>
      <div class="tarjeta uv">
        <div class="icono">☀️</div>
        <h3>Índice UV Máximo</h3>
        <p class="valor" id="ext-uvmax">--<span class="unidad">UVI</span></p>
      </div>
    </div>

    <div class="fila-3">
      <div class="tarjeta presion-max">
        <div class="icono">📈</div>
        <h3>Presión Máxima</h3>
        <p class="valor" id="ext-pmax">--<span class="unidad">hPa</span></p>
      </div>
      <div class="tarjeta presion-min">
        <div class="icono">📉</div>
        <h3>Presión Mínima</h3>
        <p class="valor" id="ext-pmin">--<span class="unidad">hPa</span></p>
      </div>
      <div class="tarjeta lluvia">
        <div class="icono">🌧️</div>
        <h3>Precipitación Total</h3>
        <p class="valor" id="ext-ppt">--<span class="unidad">mm</span></p>
      </div>
    </div>
  </div>

  <div class="center-wrapper">
    <div class="actualizado" id="txt-tiempo">Sincronizando los extremos de Tetuán...</div>
  </div>

  <script>
    const LOCAL_JSON_URL = 'datos-estacion.json';
    let weatherData = null;
    let currentPeriod = 'dia'; 

    async function loadData() {
      try {
        const response = await fetch(LOCAL_JSON_URL);
        if (!response.ok) throw new Error('Carga fallida');
        
        weatherData = await response.json();
        renderData();

        // Extracción y formateo correcto de la fecha y hora sin bugs de split
        if (weatherData.dades_act && weatherData.dades_act.DATA_HORA) {
          const fechaHoraOriginal = weatherData.dades_act.DATA_HORA; 
          const partes = fechaHoraOriginal.split(' ');
          
          const fechaComponentes = partes[0].split('-');
          const horaComponentes = partes[1].split(':');
          
          const fechaFormateada = `${fechaComponentes[2]}/${fechaComponentes[1]}/${fechaComponentes[0]}`;
          const horaFormateada = `${horaComponentes[0]}:${horaComponentes[1]}`;

          document.getElementById('txt-tiempo').textContent = `Extremos actualizados: ${fechaFormateada} a las ${horaFormateada}`;
        } else {
          document.getElementById('txt-tiempo').textContent = 'Extremos sincronizados correctamente';
        }
      } catch (error) {
        console.error(error);
        document.getElementById('txt-tiempo').textContent = 'Error: Esperando actualización del robot...';
      }
    }

    function renderData() {
      if (!weatherData) return;

      let block = {};
      let suffix = '';

      if (currentPeriod === 'dia') { block = weatherData.dades_dia || {}; suffix = '_d'; }
      else if (currentPeriod === 'mes') { block = weatherData.dades_mes || {}; suffix = '_m'; }
      else if (currentPeriod === 'any') { block = weatherData.dades_any || {}; suffix = '_a'; }

      document.getElementById('ext-tmax').innerHTML = block['TMax' + suffix] ? block['TMax' + suffix] + '<span class="unidad">°C</span>' : '--<span class="unidad">°C</span>';
      document.getElementById('ext-tmin').innerHTML = block['TMin' + suffix] ? block['TMin' + suffix] + '<span class="unidad">°C</span>' : '--<span class="unidad">°C</span>';
      document.getElementById('ext-vmax').innerHTML = block['VMax' + suffix] ? block['VMax' + suffix] + '<span class="unidad">km/h</span>' : '--<span class="unidad">km/h</span>';
      document.getElementById('ext-hmax').innerHTML = block['HMax' + suffix] ? block['HMax' + suffix] + '<span class="unidad">%</span>' : '--<span class="unidad">%</span>';
      document.getElementById('ext-hmin').innerHTML = block['HMin' + suffix] ? block['HMin' + suffix] + '<span class="unidad">%</span>' : '--<span class="unidad">%</span>';
      document.getElementById('ext-pmax').innerHTML = block['PMax' + suffix] ? block['PMax' + suffix] + '<span class="unidad">hPa</span>' : '--<span class="unidad">hPa</span>';
      document.getElementById('ext-pmin').innerHTML = block['PMin' + suffix] ? block['PMin' + suffix] + '<span class="unidad">hPa</span>' : '--<span class="unidad">hPa</span>';
      document.getElementById('ext-uvmax').innerHTML = block['UVMax' + suffix] ? block['UVMax' + suffix] + '<span class="unidad">UVI</span>' : '--<span class="unidad">UVI</span>';
      document.getElementById('ext-ppt').innerHTML = block['PPT' + suffix] ? block['PPT' + suffix] + '<span class="unidad">mm</span>' : '--<span class="unidad">mm</span>';
    }

    function switchPeriod(period) {
      currentPeriod = period;
      ['dia', 'mes', 'any'].forEach(p => { document.getElementById('btn-' + p).classList.remove('activo'); });
      document.getElementById('btn-' + period).classList.add('activo');
      renderData();
    }

    loadData();
  </script>
</body>
</html>
