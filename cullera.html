<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Meteorológica Cullera-Sant Antoni</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 450px; width: 100%; text-align: center; }
        h1 { font-size: 1.6rem; color: #1a365d; margin-bottom: 5px; }
        .location { font-size: 1rem; color: #718096; margin-bottom: 20px; font-weight: 500; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .card { background: #f7fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .card-full { grid-column: span 2; }
        .label { font-size: 0.85rem; color: #4a5568; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .value { font-size: 1.4rem; font-weight: bold; color: #2b6cb0; }
        .value-large { font-size: 2.5rem; color: #2b6cb0; }
        .update-time { font-size: 0.8rem; color: #a0aec0; margin-top: 15px; border-top: 1px solid #edf2f7; padding-top: 15px; }
        .error { color: #e53e3e; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="nombre-estacion">Cargando estación...</h1>
        <div id="ubicacion" class="location">--</div>

        <div class="grid">
            <!-- Temperatura Principal -->
            <div class="card card-full">
                <div class="label">Temperatura Actual</div>
                <div id="temp" class="value-large">-- °C</div>
            </div>
            <!-- Humedad Relativa -->
            <div class="card">
                <div class="label">Humedad</div>
                <div id="humedad" class="value">-- %</div>
            </div>
            <!-- Presión Atmosférica -->
            <div class="card">
                <div class="label">Presión</div>
                <div id="presion" class="value">-- mb</div>
            </div>
            <!-- Viento -->
            <div class="card">
                <div class="label">Viento</div>
                <div id="viento" class="value">-- km/h</div>
            </div>
            <!-- Dirección del Viento -->
            <div class="card">
                <div class="label">Dirección</div>
                <div id="viento-dir" class="value" style="font-size: 1.1rem; padding-top: 4px;">--</div>
            </div>
            <!-- Lluvia del día -->
            <div class="card card-full">
                <div class="label">Lluvia acumulada hoy</div>
                <div id="lluvia" class="value">-- mm</div>
            </div>
        </div>

        <div id="actualizado" class="update-time">Buscando actualizaciones...</div>
    </div>

    <script>
        const url = "https://api.weatherlink.com/v1/NoaaExt.json?user=001D0AE0D724&pass=semiuncial4&apiToken=BB6FD1E154A74270A0A613E9C2CFAAEE";

        function obtenerDatosWeather() {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo conectar con Davis");
                    return response.json();
                })
                .then(data => {
                    // 1. Nombres y Ubicación
                    document.getElementById("nombre-estacion").innerText = data.davis_current_observation?.station_name || data.station_id;
                    document.getElementById("ubicacion").innerText = data.location || "España";

                    // 2. Variables Meteorológicas básicas
                    document.getElementById("temp").innerText = data.temp_c ? `${data.temp_c} °C` : "-- °C";
                    document.getElementById("humedad").innerText = data.relative_humidity ? `${data.relative_humidity} %` : "-- %";
                    document.getElementById("presion").innerText = data.pressure_mb ? `${data.pressure_mb} mb` : "-- mb";
                    
                    // 3. Viento (Conversión de Nudos a Km/h: 1 nudo = 1.852 km/h)
                    if (data.wind_kt) {
                        const kmh = (parseFloat(data.wind_kt) * 1.852).toFixed(1);
                        document.getElementById("viento").innerText = `${kmh} km/h`;
                    } else {
                        document.getElementById("viento").innerText = "0 km/h";
                    }
                    document.getElementById("viento-dir").innerText = data.wind_dir || "--";

                    // 4. Lluvia del día (Conversión de Pulgadas a Milímetros: 1 pulgada = 25.4 mm)
                    if (data.davis_current_observation?.rain_day_in) {
                        const mm = (parseFloat(data.davis_current_observation.rain_day_in) * 25.4).toFixed(1);
                        document.getElementById("lluvia").innerText = `${mm} mm`;
                    } else {
                        document.getElementById("lluvia").innerText = "0.0 mm";
                    }

                    // 5. Hora de actualización del Servidor Davis
                    document.getElementById("actualizado").innerText = data.observation_time || `Actualizado: ${new Date().toLocaleTimeString()}`;
                    document.getElementById("nombre-estacion").classList.remove("error");
                })
                .catch(error => {
                    console.error("Error al obtener los datos:", error);
                    document.getElementById("nombre-estacion").innerText = "Error de Conexión";
                    document.getElementById("nombre-estacion").classList.add("error");
                    document.getElementById("ubicacion").innerText = "Verifica si hay un bloqueo CORS en tu navegador.";
                });
        }

        // Carga los datos al abrir la web
        obtenerDatosWeather();

        // Se actualiza en segundo plano automáticamente cada 5 minutos (300000 ms)
        setInterval(obtenerDatosWeather, 300000);
    </script>
</body>
</html>
