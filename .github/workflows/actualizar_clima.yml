name: Actualizar Clima

on:
  schedule:
    # Ejecución en los minutos 12, 27, 42 y 57 de cada hora
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch: # Botón manual de prueba

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4.2.2

    - name: Configurar Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.x'

    - name: Instalar librerías necesarias
      run: pip install requests

    - name: Ejecutar el script del clima
      env:
        WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
        WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
        WEATHERLINK_STATION_ID: ${{ secrets.WEATHERLINK_STATION_ID }}
      run: python actualizar_clima.py

    - name: Guardar los cambios en el repositorio
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add clima.json
        # Mensaje de commit personalizado para identificar este workflow alternativo
        git commit -m "Clima actualizado por Test Alternativo [skip ci]" || echo "No hay cambios nuevos"
        git push
