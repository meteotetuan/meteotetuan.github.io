<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Estación Meteorológica</title>
    <style>
        /* Estilos fijos y centrados en dos columnas para iframe */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            width: 940px; /* Ancho fijo total para la estructura de dos columnas */
            box-sizing: border-box;
        }
        
        .contenedor-panel {
            width: 900px; /* Espacio neto para las dos columnas */
            display: grid;
            grid-template-columns: repeat(2, 430px); /* Dos columnas simétricas de ancho fijo */
            gap: 25px; /* Espacio de separación entre tarjetas */
        }

        .tarjeta-grafico {
            background-color: #fcfcfc; /* Fondo gris claro limpio */
            border: 1px solid #e2e8f0; /* Borde gris suave */
            border-radius: 12px; /* Esquinas redondeadas */
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04); /* Sombra suave de volumen */
            text-align: center; /* Centra el título y la imagen */
            box-sizing: border-box;
        }

        .titulo-grafico {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748; /* Color gris oscuro elegante */
            margin-top: 0;
            margin-bottom: 15px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .tarjeta-grafico img {
            width: 380px; /* Ancho del gráfico optimizado para la tarjeta */
            height: auto;
            border-radius: 6px;
            border: 1px solid #edf2f7;
            display: inline-block;
            vertical-align: middle;
        }

        /* Animación suave de transición al pasar el ratón */
        .tarjeta-grafico:hover {
            border-color: #cbd5e1;
            background-color: #ffffff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
        }
    </style>
</head>
<body>

    <div class="contenedor-panel">

        <!-- 1. Temperatura -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Temperatura</span>
<a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/temperature.png" alt="Graphique" /></a>       
            
                    </div>

        <!-- 2. Humedad -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Humedad</span>
           <a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/humidite.png" alt="Graphique" /></a>           
                   </div>

        <!-- 3. Presión -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Presión</span>
            <a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/pression.png" alt="Graphique" /></a>            
                    </div>

        <!-- 4. Sensación Térmica -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Sensación Térmica</span>
            <a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/ire_humidex.png" alt="Graphique" /></a>            
        </div>

        <!-- 5. Punto de Rocío -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Punto de Rocío</span>
            <a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/td.png" alt="Graphique" /></a>                    </div>

        <!-- 6. Velocidad del Viento -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Velocidad del Viento</span>
          <a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/vent_moyen.png" alt="Graphique" /></a>          
        </div>

        <!-- 7. Dirección del Viento -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Índice UV</span>
<a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/uv_index.png" alt="Graphique" /></a>                 </div>

        <!-- 8. Índice UV -->
        <div class="tarjeta-grafico">
            <span class="titulo-grafico">Índice UV</span>
          <a href="https://infoclimat.fr/s/STATIC0304"><img style="border:0" src="https://www.infoclimat.fr/stations-meteo/images/static_full_white/STATIC0304/radiations.png" alt="Graphique" /></a>          
          
        </div>

    </div>

</body>
</html>
