<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MeteoTetuán</title>
    <style>
        /* Fondo completamente blanco */
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #011F47;
            text-align: center;
        }

        /* Encabezado Principal */
        header {
            padding: 30px 0 20px 0;
            border-bottom: 1px solid #eeeeee;
            margin-bottom: 40px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #011F47;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        /* Contenedor Estático de Ancho Fijo (No responsive) */
        .panel-estatico {
            width: 1000px; 
            margin: 0 auto;
            text-align: center;
        }

        /* Bloques de las imágenes fijas con sus títulos */
        .bloque-imagen {
            margin-bottom: 45px;
            display: block;
            text-align: center;
        }
        .titulo-grafico {
            font-size: 1.2em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        .bloque-imagen img {
            display: inline-block;
            max-width: 900px;
            height: auto;
        }

        /* Botón de volver abajo */
        footer {
            margin: 60px 0;
            padding-top: 30px;
            border-top: 1px solid #eeeeee;
        }
        .btn-volver {
            display: inline-block;
            padding: 12px 30px;
            background-color: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.95em;
        }
        .btn-volver:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>

    <!-- Encabezado de MeteoTetuán -->
    <header>
        <h1>MeteoTetuán</h1>
    </header>
<img src="images/encabezado.jpg" width="900">
    <br><br><br>
    <!-- Contenedor donde aparecerán los títulos y las imágenes -->
    <div class="panel-estatico" id="contenedorMeteo"></div>

    <!-- Enlace de vuelta a la página de inicio -->
    <footer>
        <a href="https://meteotetuan.github.io" class="btn-volver">← Volver a la página de inicio</a>
    </footer>

<script>
    // Configuración de las imágenes con sus respectivos nombres de título personalizados
    const datosImagenes = [
        { url: "https://meteotetuan.byethost7.com/pantalla.jpg", titulo: "Madrid-Tetuán - Estación meteorológica en tiempo real" },
        { url: "https://meteotetuan.byethost7.com/dailyhighlowbaroetc.gif", titulo: "Valores extremos diarios" },
{ url: "https://meteotetuan.byethost7.com/curr24hourgraph.gif", titulo: "Gráfico de las últimas 24 horas" },        
        { url: "https://meteotetuan.byethost7.com/curr48hourgraph.gif", titulo: "Gráfico de las últimas 48 horas" },
        { url: "https://meteotetuan.byethost7.com/curr72hourgraph.gif", titulo: "Gráfico de las últimas 72 horas" },
    ];

    const tiempoRefresco = 60000; // Sincronización en vivo cada 1 minuto

    function refrescarTodoElPanel() {
        const contenedor = document.getElementById('contenedorMeteo');
        const cacheBuster = new Date().getTime();
        
        // Limpiamos el contenedor para forzar la actualización limpia
        contenedor.innerHTML = "";
        
        // Generamos los bloques estructurados con Título + Imagen
        datosImagenes.forEach(item => {
            const divBloque = document.createElement('div');
            divBloque.className = "bloque-imagen";
            
            // Creamos el elemento del título
            const h3Titulo = document.createElement('div');
            h3Titulo.className = "titulo-grafico";
            h3Titulo.innerText = item.titulo;
            
            // Creamos la imagen aplicando la protección anti-caché y anti-bloqueo
            const imgNode = document.createElement('img');
            imgNode.src = item.url + "?v=" + cacheBuster;
            imgNode.alt = item.titulo;
            imgNode.setAttribute('referrerpolicy', 'no-referrer');
            
            // Unimos todo en la interfaz
            divBloque.appendChild(h3Titulo);
            divBloque.appendChild(imgNode);
            contenedor.appendChild(divBloque);
        });
    }

    // Inicialización inmediata al abrir el sitio
    refrescarTodoElPanel();

    // Actualización silenciosa automática permanente
    setInterval(refrescarTodoElPanel, tiempoRefresco);
</script>

</body>
</html>
