<!-- Diseña tu propia tabla con tipografía grande y legible en móvil -->
<div id="panel-meteo" style="font-family: Arial, sans-serif; padding: 15px; border-radius: 8px; background: #f5f5f5; max-width: 400px; margin: 0 auto;">
  <h2 style="font-size: 24px; text-align: center; margin-bottom: 20px;">Meteo Tetuán</h2>
  <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px;">
    <strong>Temperatura:</strong> <span id="temp">Cargando...</span>
  </div>
  <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px;">
    <strong>Humedad:</strong> <span id="hum">Cargando...</span>
  </div>
  <div style="display: flex; justify-content: space-between; font-size: 18px;">
    <strong>Viento:</strong> <span id="viento">Cargando...</span>
  </div>
</div>

<script>
// URL de datos de tu estación de WeatherLink
const urlEstacion = "https://www.weatherlink.com/embeddablePage/show/69089c037c094f15a466feb66f9ccf92/summary"; 

async function obtenerDatosMeteo() {
  try {
    const respuesta = await fetch(urlEstacion);
    const datos = await respuesta.json();
    
    // Suponiendo la estructura estándar de datos de Davis:
    // (Nota: Los nombres exactos dependen de los sensores de tu estación)
    document.getElementById('temp').innerText = datos.sensors[0].data[0].temp + " °C";
    document.getElementById('hum').innerText = datos.sensors[0].data[0].hum + " %";
    document.getElementById('viento').innerText = datos.sensors[0].data[0].wind_speed_last + " km/h";
  } catch (error) {
    console.error("Error al cargar los datos meteorológicos:", error);
    document.getElementById('temp').innerText = "--";
  }
}

// Carga los datos al entrar y los actualiza cada 5 minutos
obtenerDatosMeteo();
setInterval(obtenerDatosMeteo, 300000);
</script>
